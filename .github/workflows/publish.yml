name: publish
on:
  schedule: [{ cron: '0 6 * * *' }]
  workflow_dispatch:
  push: { branches: [main] }
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, registry-url: 'https://registry.npmjs.org' }
      - run: npm ci
      - run: npm test
      - name: Publish when the API or the code changed
        run: |
          if [ -z "$(npm view "@orvlabs/iris@$(jq -r .version package.json)" version 2>/dev/null)" ]; then npm publish; exit 0; fi
          npm version "$(npm view @orvlabs/iris version)" --no-git-tag-version --allow-same-version >/dev/null
          if [ "$(npm pack --dry-run --json | jq -r '.[0].shasum')" = "$(npm view @orvlabs/iris dist.shasum)" ]; then echo "unchanged"; exit 0; fi
          npm version patch --no-git-tag-version
          npm publish
